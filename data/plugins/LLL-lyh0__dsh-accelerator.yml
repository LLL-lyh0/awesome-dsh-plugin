description:
  en: 'Repairs domains blocked by SNI filtering from inside DSH, without any self-hosted server. Runs a loopback MITM proxy with a per-domain SNI policy (real / none / cdn, picked by probing each upstream), bootstraps hosts entries, races a node pool every 15 minutes, and installs its own local CA. Domains blocked by SNI outright — where every IP is refused because the reset follows the name, not the address — can be handed whole to an external HTTP or SOCKS5 upstream, either globally as a fallback or per domain. Ships an accelerator-repair skill so the agent can diagnose and re-seed the node pool itself.'
  zh: '在不依赖任何自建服务器的前提下，从 DSH 内部修复被 SNI 阻断的域名。运行回环 MITM 代理，按域名逐个实测决定 SNI 策略（real / none / cdn），引导 hosts 条目，每 15 分钟对节点池竞速优选，并安装自己的本地 CA。对整段 SNI 被阻断、换任何 IP 都被拒的域名（RST 跟着域名走而不是地址走），可以整个交给外部 HTTP 或 SOCKS5 上游转发，支持全局兜底与按域名覆盖。自带 accelerator-repair 技能，让 Agent 能自行诊断并补充节点池。'
