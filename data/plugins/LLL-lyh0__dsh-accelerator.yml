description:
  en: 'Repairs domains blocked by SNI filtering from inside DSH, without any self-hosted server. Runs a loopback MITM proxy with a per-domain SNI policy (real / none / cdn, picked by probing each upstream), bootstraps hosts entries, races a node pool every 15 minutes, and installs its own local CA. Ships an accelerator-repair skill so the agent can diagnose and re-seed the node pool itself.'
  zh: '在不依赖任何自建服务器的前提下，从 DSH 内部修复被 SNI 阻断的域名。运行回环 MITM 代理，按域名逐个实测决定 SNI 策略（real / none / cdn），引导 hosts 条目，每 15 分钟对节点池竞速优选，并安装自己的本地 CA。自带 accelerator-repair 技能，让 Agent 能自行诊断并补充节点池。'
